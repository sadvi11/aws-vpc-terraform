name: Terraform CI

# The previous version of this workflow ran fmt and validate only. Both pass on
# a VPC that puts the database on the public internet: valid HCL and a correct
# design are different questions, and only the first was being asked.
#
# This plans the real configuration with no AWS account and asserts the
# security properties the README claims - then breaks each one on purpose to
# show the assertions can fail.

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

env:
  # Pointed at nothing so the plan cannot quietly succeed on an ambient
  # credential and appear to need no account when it does.
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  AWS_CONFIG_FILE: /dev/null
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pytest

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate the real configuration
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Plan the same configuration with no AWS account
        working-directory: tests/plan
        run: |
          terraform init -backend=false -input=false
          terraform plan -refresh=false -input=false -var-file=plan.tfvars -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Assert the security properties
        run: pytest tests/test_vpc_security.py -v

      - name: Break each control and prove a test catches it
        run: python tests/verify_controls_fail.py

      - name: The configuration is unchanged after fault injection
        run: git diff --exit-code
